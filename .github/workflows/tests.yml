# Every push and pull request: the translations checked, the mod built (the zip kept as a download of the run) and
# the offline tests run on made-up fields (tools/fixtures/test_fields.json; locally they run on a real map's fields).
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Translations
        run: python tools/check_translations.py
      - name: Build the zip
        run: python tools/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: FS25_CourseCorrect
          path: dist/FS25_CourseCorrect.zip

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # test file and its arguments (the made-up fields; batch 3 and the team drive on field 12: field 9 is narrow)
        test:
          - smoke_test.py tools/fixtures/test_fields.json
          - scopes_test.py tools/fixtures/test_fields.json
          - batch2_test.py tools/fixtures/test_fields.json
          - batch3_test.py tools/fixtures/test_fields.json 12
          - fieldscan_test.py tools/fixtures/test_fields.json
          - helpers_test.py tools/fixtures/test_fields.json
          - team_test.py tools/fixtures/test_fields.json
          - pathfinder_test.py tools/fixtures/test_fields.json --fields 1,2,3,7,12,18,24,27
          - support_test.py tools/fixtures/test_fields.json
          - vines_test.py tools/fixtures/test_fields.json
          - envelope_test.py tools/fixtures/test_fields.json
          - team_drive_test.py tools/fixtures/test_fields.json 12 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install lupa numpy pillow
      - name: ${{ matrix.test }}
        run: python -u tools/${{ matrix.test }}
