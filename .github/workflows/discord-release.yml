# Posts a published release to the DTM Mods Discord (#mod-releases) and pings @Release Pings.
# Runs by itself when a release is published by hand. A release made by another workflow with the
# built-in GITHUB_TOKEN does not trigger it, so such a workflow starts it afterwards with:
#   gh workflow run discord-release.yml -f tag=<tag>
# Needs the repository secret DISCORD_RELEASES_WEBHOOK (the Discord webhook URL).
name: Discord release post

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to announce, e.g. v1.2.0.0"
        required: true
      dry_run:
        description: "Only print the message, do not post it"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Post to Discord
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WEBHOOK: ${{ secrets.DISCORD_RELEASES_WEBHOOK }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          DRY_RUN: ${{ inputs.dry_run || false }}
          ROLE_ID: "1569731457105010689"
        run: |
          gh release view "$TAG" --json name,tagName,body,url,isPrerelease,isDraft > release.json
          python3 - <<'EOF'
          import json, os, urllib.request

          rel = json.load(open("release.json"))
          if rel["isDraft"]:
              print("Draft release, nothing to post")
              raise SystemExit(0)

          repo = os.environ["GH_REPO"].split("/")[1]
          title = rel["name"] or f'{repo.removeprefix("FS25_").replace("_", " ")} {rel["tagName"]}'
          test = " (test build)" if rel["isPrerelease"] else ""
          role = os.environ["ROLE_ID"]
          body = (rel["body"] or "").strip()
          if len(body) > 3800:
              body = body[:3800].rstrip() + "\n\n...full notes on GitHub"

          payload = {
              "username": "DTM Releases",
              "content": f"<@&{role}> **{title}** is out!{test}",
              "allowed_mentions": {"roles": [role]},
              "embeds": [{
                  "title": f"{title}{test}",
                  "url": rel["url"],
                  "description": body or "No release notes.",
                  "color": 0xF59E0B if test else 0x2ECC71,
                  "footer": {"text": repo},
              }],
          }

          if os.environ.get("DRY_RUN") == "true":
              print(json.dumps(payload, indent=2))
              raise SystemExit(0)
          if not os.environ.get("WEBHOOK"):
              raise SystemExit("The DISCORD_RELEASES_WEBHOOK secret is not set")

          req = urllib.request.Request(
              os.environ["WEBHOOK"] + "?wait=true",
              data=json.dumps(payload).encode(),
              headers={"Content-Type": "application/json", "User-Agent": "dtm-release-post"},
          )
          with urllib.request.urlopen(req) as resp:
              print("Posted to Discord, HTTP", resp.status)
          EOF
